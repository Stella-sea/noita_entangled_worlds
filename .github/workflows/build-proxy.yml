name: Build noita_proxy

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows proxy
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build noita_proxy
        run: cargo build --manifest-path noita_proxy/Cargo.toml --package noita_proxy --release

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item noita_proxy/target/release/noita_proxy.exe dist/noita_proxy.exe
          Compress-Archive -Path dist/noita_proxy.exe -DestinationPath noita_proxy-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noita_proxy-windows
          path: noita_proxy-windows.zip

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: noita_proxy-windows.zip
